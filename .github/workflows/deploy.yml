name: Deploy - Frontend to Vercel and Artifacts

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ── Frontend build + Vercel deploy ─────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate environment template
        run: yarn check:setup --warn-only

      - name: Build frontend
        run: yarn run build
        env:
          CI: true

      - name: Generate frontend checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} \; > ../frontend-checksums.txt
          sha256sum ../frontend-checksums.txt > ../frontend-checksums.txt.sha256

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Upload frontend checksums
        uses: actions/upload-artifact@v7
        with:
          name: frontend-checksums-${{ github.sha }}
          path: |
            frontend-checksums.txt
            frontend-checksums.txt.sha256
          retention-days: 30

      - name: Deploy to Vercel
        if: |
          env.VERCEL_TOKEN != '' &&
          env.VERCEL_ORG_ID != '' &&
          env.VERCEL_PROJECT_ID != ''
        run: yarn dlx vercel@latest --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Soroban contract build + WASM artifacts ─────────────────────────────────
  # Toolchain must be ≥ 1.91.0 — soroban-sdk ≥ 26 requires it.
  contract-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contract
        run: cargo build --release -p prompt-hash --target wasm32v1-none
        env:
          CARGO_TERM_COLOR: always

      - name: List WASM artifacts
        run: ls -lah target/wasm32v1-none/release/*.wasm

      - name: Generate WASM checksums
        run: |
          cd target/wasm32v1-none/release
          sha256sum *.wasm > ../../../wasm-checksums.txt
          sha256sum ../../../wasm-checksums.txt > ../../../wasm-checksums.txt.sha256

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contract-wasm-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 30

      - name: Upload WASM checksums
        uses: actions/upload-artifact@v7
        with:
          name: wasm-checksums-${{ github.sha }}
          path: |
            wasm-checksums.txt
            wasm-checksums.txt.sha256
          retention-days: 30

  # ── Production smoke test ───────────────────────────────────────────────────
  production-smoke-test:
    name: Verify production health endpoints
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://promptmint.io' }}
        run: |
          set -euo pipefail
          for endpoint in /api/health /api/status; do
            file="health$(echo "$endpoint" | tr '/' '_').json"
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              --retry-all-errors --max-time 20 "${PRODUCTION_URL}${endpoint}" -o "$file"
          done

      - name: Upload health responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.sha }}
          path: health*.json
          if-no-files-found: warn
          retention-days: 7

  # ── Sign artifacts ──────────────────────────────────────────────────────────
  sign-artifacts:
    needs: [contract-build, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.3"

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: contract-wasm-${{ github.sha }}
          path: ./artifacts/wasm

      - name: Download WASM checksums
        uses: actions/download-artifact@v8
        with:
          name: wasm-checksums-${{ github.sha }}
          path: ./artifacts

      - name: Download frontend checksums
        uses: actions/download-artifact@v8
        with:
          name: frontend-checksums-${{ github.sha }}
          path: ./artifacts

      - name: Generate deploy manifest
        run: |
          mkdir -p manifest-staging
          cp ./artifacts/wasm/*.wasm ./artifacts/frontend-checksums.txt manifest-staging/
          cd manifest-staging
          node ../scripts/deploy-manifest.mjs generate \
            --network release \
            --wasm prompt_hash.wasm \
            --artifact frontend-checksums.txt \
            --out ../artifacts/deploy-manifest.json

      - name: Create combined checksum manifest
        run: |
          cat ./artifacts/wasm-checksums.txt ./artifacts/frontend-checksums.txt > ./artifacts/release-checksums.txt
          (cd ./artifacts && sha256sum deploy-manifest.json) >> ./artifacts/release-checksums.txt
          echo "" >> ./artifacts/release-checksums.txt
          echo "# Release ${{ github.sha }}" >> ./artifacts/release-checksums.txt
          echo "# Build timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ./artifacts/release-checksums.txt
          echo "# Repository: ${{ github.repository }}" >> ./artifacts/release-checksums.txt
          echo "# Workflow: ${{ github.workflow }}" >> ./artifacts/release-checksums.txt
          echo "# Run ID: ${{ github.run_id }}" >> ./artifacts/release-checksums.txt
          sha256sum ./artifacts/release-checksums.txt > ./artifacts/release-checksums.txt.sha256

      - name: Sign checksums with cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle ./artifacts/release-checksums.txt.sig \
            ./artifacts/release-checksums.txt

      - name: Sign WASM artifacts with cosign
        run: |
          for wasm in ./artifacts/wasm/*.wasm; do
            cosign sign-blob \
              --yes \
              --bundle "${wasm}.sig" \
              "$wasm"
          done

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./artifacts/wasm/*.wasm
            ./artifacts/release-checksums.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-${{ github.sha }}
          path: |
            ./artifacts/release-checksums.txt
            ./artifacts/release-checksums.txt.sha256
            ./artifacts/release-checksums.txt.sig
            ./artifacts/deploy-manifest.json
            ./artifacts/frontend-checksums.txt
            ./artifacts/wasm/*.wasm
            ./artifacts/wasm/*.wasm.sig
          retention-days: 90

  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Generate frontend SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx \
            --lockfile-only \
            --output-format JSON \
            --output-file sbom/frontend-sbom.json

      - name: Install Rust toolchain for cargo-cyclonedx
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate contract SBOM (CycloneDX)
        run: |
          cargo cyclonedx \
            --manifest-path contracts/prompt-hash/Cargo.toml \
            --format json \
            --override-filename contract-sbom
          mv contracts/prompt-hash/contract-sbom.json sbom/contract-sbom.json

      - name: Use Node.js for server SBOM (no Corepack needed)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        # --package-lock-only avoids touching node_modules and prevents
        # `npm ls` ELSPROBLEMS when the lock file is ahead of installed deps.
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate server SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          cd server
          npx -y @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --output-format JSON \
            --output-file ../sbom/server-sbom.json

      - name: Create SBOM manifest
        run: |
          mkdir -p sbom
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg repo "${{ github.repository }}" \
            --arg run_id "${{ github.run_id }}" \
            '{release: $sha, generatedAt: $ts, repository: $repo, runId: $run_id, sbomFiles: ["frontend-sbom.json","contract-sbom.json","server-sbom.json"]}' \
            > sbom/sbom-manifest.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90

  # ── Create release ──────────────────────────────────────────────────────────
  create-release:
    needs: [sign-artifacts, contract-build, generate-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read

    steps:
      - uses: actions/checkout@v7

      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-release-${{ github.sha }}
          path: ./signed-release

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.3"

      - name: Verify deployment provenance
        run: |
          set -euo pipefail
          mkdir -p flat
          find signed-release -type f -exec cp {} flat/ \;
          cosign verify-blob \
            --bundle flat/release-checksums.txt.sig \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            flat/release-checksums.txt
          (cd flat && grep ' deploy-manifest.json$' release-checksums.txt | sha256sum -c -)
          node scripts/deploy-manifest.mjs verify --manifest flat/deploy-manifest.json --root flat
          node scripts/deploy-manifest.mjs badge --manifest flat/deploy-manifest.json --root flat \
            --out signed-release/provenance-badge.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: deploy-${{ github.sha }}
          name: Deploy ${{ github.sha }}
          body: |
            Automated release from **Deploy - Frontend to Vercel and Artifacts**.

            - Frontend deployed to Vercel production
            - Signed WASM + checksum artifacts
            - `deploy-manifest.json` with artifact hashes (verified before publishing)
            - SBOM attached when available

            See [artifact-verification.md](./docs/artifact-verification.md) and [deploy-manifest.md](./docs/deploy-manifest.md).
          draft: false
          prerelease: false
          files: |
            signed-release/**
            sbom/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
